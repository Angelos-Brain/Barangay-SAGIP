<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M200 20
           L330 65
           V210
           C330 320 275 385 200 430
           C125 385 70 320 70 210
           V65
           Z"
        fill="url(#shieldGrad)"
        stroke="#0F172A"
        stroke-width="4"/>

  <!-- Inner shield outline for depth -->
  <path d="M200 45
           L308 82
           V208
           C308 302 261 358 200 398
           C139 358 92 302 92 208
           V82
           Z"
        fill="none"
        stroke="#3B82F6"
        stroke-width="2"
        stroke-opacity="0.35"/>

  <!-- House / community roof shape -->
  <path d="M140 235 L200 175 L260 235 V300 H140 Z"
        fill="#F8FAFC"/>
  <path d="M130 240 L200 168 L270 240 L255 250 L200 196 L145 250 Z"
        fill="#F8FAFC"/>

  <!-- Door -->
  <rect x="182" y="255" width="36" height="45" rx="4" fill="#1E3A8A"/>

  <!-- Heart / rescue symbol overlapping roof, in accent gradient -->
  <path d="M200 205
           C192 193 172 193 166 210
           C161 224 175 236 200 254
           C225 236 239 224 234 210
           C228 193 208 193 200 205 Z"
        fill="url(#accentGrad)"
        stroke="#7C2D12"
        stroke-width="1.5"/>

  <!-- Wordmark -->
  <text x="200" y="452" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="40" letter-spacing="2" fill="#1E293B">BARANGAY</text>
  <text x="200" y="478" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="6" fill="#EF4444">SAGIP</text>
</svg>
