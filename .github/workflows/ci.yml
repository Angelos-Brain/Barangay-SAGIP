name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: barangay-sagip

jobs:
  laravel:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: barangay_sagip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d barangay_sagip_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: barangay-sagip-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer security audit
        run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: barangay_sagip_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      - name: Run Laravel tests against PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: barangay_sagip_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

      - name: PHP syntax check
        run: |
          find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: NPM security audit
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tokenization-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tokenization-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python dependency security audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import service modules
        run: python -c "import main; import tokenizer_classifier; print('Python service imports OK')"

      - name: Run tokenization service tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Compose environment
        run: cp barangay-sagip-web/.env.production.example barangay-sagip-web/.env.production

      - name: Validate production Compose configuration
        run: docker compose --env-file docker-compose.production.env.example -f docker-compose.production.yml config

      - name: Build production images
        run: docker compose --env-file docker-compose.production.env.example -f docker-compose.production.yml build

      - name: Scan Laravel image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'barangay-sagip-app'
          format: 'sarif'
          output: 'trivy-laravel.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan queue worker image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'barangay-sagip-queue-worker'
          format: 'sarif'
          output: 'trivy-queue.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan Nginx image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'barangay-sagip-nginx'
          format: 'sarif'
          output: 'trivy-nginx.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan tokenization service image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'barangay-sagip-tokenization-service'
          format: 'sarif'
          output: 'trivy-tokenization.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload container scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-security-reports
          path: '*.sarif'
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce container security gate
        if: always()
        run: |
          set -e
          total=0
          for report in trivy-*.sarif; do
            [ -f "$report" ] || continue
            count=$(jq '[.runs[].results[]? | select(.level == "error")] | length' "$report")
            if [ "$count" -gt 0 ]; then
              echo "$report contains $count HIGH/CRITICAL findings."
              total=$((total + count))
            fi
          done
          if [ "$total" -gt 0 ]; then
            echo "Container security gate failed with $total HIGH/CRITICAL findings."
            exit 1
          fi
          echo "Container security gate passed: no HIGH/CRITICAL findings in scanned images."

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner
